<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Player Login — Zephyr Arcade</title>
  <meta name="description" content="Sign in to your Zephyr Arcade account.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Lucida Grande", sans-serif;
      background: radial-gradient(circle at 20% 20%, #ff6b35 0%, #7b2cbf 45%, #1a0a2e 100%);
      color: #f5f0ff;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .logo-mark {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: conic-gradient(from 210deg, #ffd60a, #ff006e, #8338ec, #3a86ff);
      box-shadow: 0 4px 20px rgba(255, 0, 110, 0.45);
    }
    .tagline {
      font-size: 0.75rem;
      opacity: 0.85;
      text-align: right;
      max-width: 220px;
      line-height: 1.3;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem 3rem;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 2.25rem 2rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .card h1 {
      margin: 0 0 0.35rem;
      font-size: 1.75rem;
      font-weight: 700;
    }
    .card .sub {
      margin: 0 0 1.75rem;
      font-size: 0.9rem;
      opacity: 0.9;
    }
    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.35rem;
      opacity: 0.95;
    }
    input {
      width: 100%;
      margin-bottom: 1.1rem;
      padding: 0.85rem 1rem;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 1rem;
    }
    input::placeholder { color: rgba(255, 255, 255, 0.45); }
    .btn {
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #ff006e, #ffbe0b);
      color: #1a0a2e;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .links {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.8rem;
    }
    .links a { color: #ffd60a; text-decoration: underline; }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="logo">
      <span class="logo-mark" aria-hidden="true"></span>
      Zephyr Arcade
    </div>
    <p class="tagline">Play. Compete. Win daily loot crates.</p>
  </header>

  <main>
    <div class="card">
      <h1>Player Login</h1>
      <p class="sub">Enter your gamer tag and secret key to continue.</p>

      <form action="https://example.net/zephyr/session" method="post">
        <label for="gamer">Gamer tag</label>
        <input id="gamer" name="username" type="text" placeholder="xX_NovaBlade_Xx" autocomplete="username" required />

        <label for="secret">Secret key</label>
        <input id="secret" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />

        <button type="submit" class="btn">Launch session</button>
      </form>

      <div class="links">
        <a href="#">Forgot secret key?</a> · <a href="#">Create free account</a>
      </div>
    </div>
  </main>
</body>
</html>
